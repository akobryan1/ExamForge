# Render.com Deployment Configuration
# https://render.com/docs/infrastructure-as-code

services:
  # Backend API Service
  - type: web
    name: examforge-backend
    env: node
    region: oregon
    plan: starter
    rootDirectory: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FIRESTORE_PROJECT_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SIGNALR_HUB_URL
        value: https://examforge-signalr.onrender.com/sessionHub
      - key: ESSAY_GRADING_API_URL
        value: https://examforge-signalr.onrender.com/api/essay/grade
    healthCheckPath: /health
    
  # Frontend Static Site
  - type: static
    name: examforge-frontend
    rootDirectory: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: examforge-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: examforge-201e8.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: examforge-201e8
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: examforge-201e8.appspot.com
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SIGNALR_HUB_URL
        value: https://examforge-signalr.onrender.com/sessionHub
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Exam Portal Static Site
  - type: web
    name: examforge-exam-portal
    env: static
    region: oregon
    rootDirectory: exam-portal
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: examforge-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        value: examforge-201e8.firebaseapp.com
      - key: VITE_FIREBASE_PROJECT_ID
        value: examforge-201e8
      - key: VITE_FIREBASE_STORAGE_BUCKET
        value: examforge-201e8.appspot.com
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
